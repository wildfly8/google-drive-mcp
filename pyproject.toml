[project]
name = "google-drive-mcp"
version = "0.1.0"
description = "Read-only Google Drive MCP server for agentic retrieval"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "google-auth",
    "google-api-python-client",
    "pydantic>=2",
    "httpx",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
google-drive-mcp = "google_drive_mcp.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_drive_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
